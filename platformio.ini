[platformio]
default_envs = sender, receiver
src_dir = firmware

[env]
monitor_speed = 115200
extra_scripts = pre:scripts/upload.py

[env:sender]
; Community platform provides RP2350 / Pico 2 W support.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2w
framework = picosdk
build_src_filter = -<*> +<sender/*.c>
build_flags =
    -DPIO_STDIO_USB
    -DPICO_STDIO_USB_CONNECT_WAIT_TIMEOUT_MS=0
    -DPICO_STDIO_USB_STDOUT_TIMEOUT_US=1000
    -DPICO_STDIO_USB_ENABLE_RESET_VIA_BAUD_RATE=1
    -DPICO_STACK_SIZE=0x1000
    -DPICO_USE_STACK_GUARDS=1
    -DPICO_CYW43_SUPPORTED=1
; Hold BOOTSEL while connecting; override with --upload-port /path/to/RP2350.
upload_port = /run/media/YOUR_USER/RP2350

[env:receiver]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.esp-idf.sdkconfig_path = firmware/receiver/sdkconfig.receiver
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=firmware/receiver/sdkconfig.defaults
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_XX:XX:XX:XX:XX:XX-if00
